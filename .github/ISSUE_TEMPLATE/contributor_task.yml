name: Contributor task
description: Scoped Soroban implementation work for contributors
title: "[Task]: "
labels: ["type: task", "status: needs triage"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain why this work matters.
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Suggested implementation
      description: Include contracts, storage keys, invariants, and constraints.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List concrete completion checks.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Commands and tests required.
    validations:
      required: true
